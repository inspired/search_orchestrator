# Search Orchestrator REST API (spec sections 9-11). The handler uses the
# caller's session for hidden saved searches and the system session for KV
# Store and secrets.
[script:orchestrator_api]
match = /orchestrator
script = orchestrator_rest.py
scripttype = persist
handler = orchestrator_rest.Handler
requireAuthentication = true
output_modes = json
passPayload = true
passSession = true
passSystemAuth = true
python.version = python3
python.required = 3.9,3.13
