# "Start orchestrator job": lets any alert start a Search Orchestrator job
# (bin/start_orchestrator_job.py). The run is started with the alert's own
# session, so the alert's owner must be allowed to run the job.
[start_orchestrator_job]
is_custom = 1
label = Start orchestrator job
description = Start a Search Orchestrator job when the alert fires.
payload_format = json
python.version = python3
python.required = 3.9,3.13
param.job =
param.params =
param.scheduled_time =
