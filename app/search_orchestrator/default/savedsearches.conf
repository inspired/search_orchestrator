# System-owned fallback notification (spec section 10). The engine dispatches it
# under owner nobody with args.to, args.subject and args.message, each escaped
# as SPL string contents. Never scheduled and hidden from saved-search lists.
[_so_fallback_email]
search = | makeresults | sendemail to="$args.to$" subject="$args.subject$" message="$args.message$"
description = Search Orchestrator fallback notification email.
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 0
is_visible = false
