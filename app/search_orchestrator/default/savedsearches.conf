# System-owned fallback notification (spec section 10). The engine dispatches it
# under owner nobody with args.to, args.subject and args.message, each escaped
# as SPL string contents. Never scheduled and hidden from saved-search lists.
[_so_fallback_email]
search = | makeresults | sendemail to="$args.to$" subject="$args.subject$" message="$args.message$"
description = Search Orchestrator fallback notification email.
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 0
is_visible = false

# App health alerts: off by default. An admin turns each on in Settings > Searches, reports,
# and alerts (app Search Orchestrator, Edit > Enable); once on, each adds a Triggered Alert
# (Activity > Triggered Alerts) when the app itself needs attention. To be told by email or
# another way, edit the alert there and add an action. They search the
# app's own log lines (the orchestrator_logs macro), so they cost one small _internal search each.
[Search Orchestrator - Engine not running]
description = No heartbeat from the engine for 15 minutes: schedules don't fire and no run advances. Open Troubleshooting in the app; check that Splunk runs the orchestrator_engine input and that KV Store is up.
search = `orchestrator_logs` process=engine (event=heartbeat OR event=lease_acquired OR event=ticks_resumed) | stats count AS lines | where lines=0 | eval problem="The Search Orchestrator engine has not logged a heartbeat for 15 minutes"
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
disabled = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 1h

[Search Orchestrator - Missed schedules]
description = Scheduled runs that never started in the last 15 minutes because the engine was down or busy for longer than the job's Missed runs setting catches up. Open Troubleshooting and filter on Skipped schedules.
search = `orchestrator_logs` event=schedule_missed | stats sum(missed) AS missed_runs dc(job_id) AS jobs values(job_id) AS job_ids max(seconds) AS longest_gap_seconds | where missed_runs > 0
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
disabled = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 1

[Search Orchestrator - Errors]
description = The app logged errors in the last 15 minutes. Open Troubleshooting > Problems in the app: each error is explained there, with what to do.
search = `orchestrator_logs` level=ERROR | stats count AS errors dc(event) AS kinds values(event) AS events values(process) AS processes | where errors > 0
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
disabled = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 1h
