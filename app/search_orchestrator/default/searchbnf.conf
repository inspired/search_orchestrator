[orchestrate-command]
syntax = orchestrate <orchestrate-action> (<orchestrate-option>)*
shortdesc = Start, inspect and control Search Orchestrator runs.
description = Starts a job (start), shows a run's steps (status), cancels a run (cancel), \
    re-runs a run from a step (rerun), lists the jobs you may run (jobs), or runs the \
    built-in self-test (selftest, admin only). Every action uses your own permissions. \
    For start, each param.<name>=<value> sets a job parameter. For rerun, definition is \
    required when the job changed since the run started. status returns one row for the \
    run and one row per step.
usage = public
tags = orchestrator orchestrate job run
example1 = | orchestrate start job=daily_rollup param.region=eu
comment1 = Start a run of job daily_rollup with parameter region set to eu.
example2 = | orchestrate status job=daily_rollup
comment2 = Show the latest runs of job daily_rollup, one row per step.
example3 = | orchestrate rerun run="daily_rollup:1767229200" step=daily definition=original
comment3 = Re-run a failed run from step daily with the run's original definition.
example4 = | orchestrate selftest scenario=probe
comment4 = Check the app's calls to splunkd on this server (admin only).

[orchestrate-action]
syntax = start|status|cancel|rerun|jobs|selftest
description = What to do.

[orchestrate-option]
syntax = job=<string>|run=<string>|step=<string>|scheduled_time=<int>|limit=<int>|definition=(latest|original)|restart_downstream_jobs=<bool>|scenario=(basic|rollup_late|rollup_fail|probe)|slow_n=<int>|delayed_after=<int>|param.<name>=<string>
description = Options of the action. start needs job; cancel needs run; rerun needs run and step.
