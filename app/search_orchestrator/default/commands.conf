# | orchestrate: start, inspect and control runs (bin/orchestrate.py).
# Calls the app's REST endpoint over loopback with the caller's own session.
[orchestrate]
filename = orchestrate.py
chunked = true
python.version = python3
python.required = 3.9,3.13
# It changes state (start, cancel, approve, re-run, backfill) with the caller's session, so
# Splunk's SPL safeguards warn before it runs from a link or a dashboard.
is_risky = true
