[orchestrator:audit]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = "_time":\s*
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 20

# The app's troubleshooting log files (bin/so/logs.py), which splunkd's own monitor of
# $SPLUNK_HOME/var/log/splunk indexes into _internal. Without this they get a learned
# sourcetype per file (<file>-too_small). One event per line; a Python traceback stays
# with the line before it. Fields are key=value (KV_MODE auto).
# One stanza per file, not a wildcard: "." in a source pattern matches any character, so
# "search_orchestrator.*" would also catch the side-by-side copy's files.
[source::.../var/log/splunk/search_orchestrator.engine.log(.\d+)?]
sourcetype = orchestrator:log

[source::.../var/log/splunk/search_orchestrator.rest.log(.\d+)?]
sourcetype = orchestrator:log

[orchestrator:log]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} )
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N %z
MAX_TIMESTAMP_LOOKAHEAD = 32
TRUNCATE = 20000
KV_MODE = auto
