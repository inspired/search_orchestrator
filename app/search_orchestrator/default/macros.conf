# The app's audit events: Splunk's own _audit index, so who may search them is set by
# Splunk's roles (by default only admins).
[orchestrator_index]
definition = index=_audit sourcetype="orchestrator:audit"
iseval = 0

# The app's own lines in splunkd.log (_internal), for the Run health dashboard: the engine
# modular input (ExecProcessor copies its stderr), the REST handler (PersistentScript, whose
# lines carry the "orchestrator_rest:" prefix), the alert action (sendmodalert) and the
# search command (ChunkedExternProcessor; most of its messages stay in the search's own
# search.log). The script and command names are exact terms, so the side-by-side test copy
# (scripts/package_variant.sh) does not match these lines, nor these the copy's.
[orchestrator_internal]
definition = index=_internal sourcetype=splunkd ((component=ExecProcessor "orchestrator_engine.py") OR (component=PersistentScript "orchestrator_rest") OR (component=sendmodalert "start_orchestrator_job") OR (component=ChunkedExternProcessor "orchestrate"))
iseval = 0

# The engine process in splunkd's resource-usage samples (_introspection, every 10 seconds):
# shows the engine alive even while it has nothing to log or audit.
[orchestrator_engine_process]
definition = index=_introspection sourcetype=splunk_resource_usage component=PerProcess "orchestrator_engine.py"
iseval = 0

# Search processes in splunkd's resource-usage samples (_introspection), keyed by the search ID
# (sid): the Run health Performance section joins them to the step attempts for peak CPU and memory.
[orchestrator_search_process]
definition = index=_introspection sourcetype=splunk_resource_usage component=PerProcess data.search_props.sid=*
iseval = 0

# The app's own troubleshooting log lines (bin/so/logs.py): one file per process,
# $SPLUNK_HOME/var/log/splunk/search_orchestrator.<process>.log, indexed into _internal by splunkd.
# key=value lines: level, process, logger, event, run_id, job_id, step_id and more.
[orchestrator_logs]
definition = index=_internal source="*search_orchestrator.*.log"
iseval = 0
