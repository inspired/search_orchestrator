# Expose the REST API through Splunk Web (/en-US/splunkd/__raw/servicesNS/...).
[expose:orchestrator]
pattern = orchestrator
methods = GET, POST, PUT, DELETE

[expose:orchestrator_1]
pattern = orchestrator/*
methods = GET, POST, PUT, DELETE

[expose:orchestrator_2]
pattern = orchestrator/*/*
methods = GET, POST, PUT, DELETE

[expose:orchestrator_3]
pattern = orchestrator/*/*/*
methods = GET, POST, PUT, DELETE
