<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="330" viewBox="0 0 1220 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F1F4F9"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#E1E6EE"/></pattern><radialGradient id="glow" cx="0.78" cy="0.45" r="0.55"><stop offset="0" stop-color="#0B6FA4" stop-opacity="0.18"/><stop offset="1" stop-color="#0B6FA4" stop-opacity="0"/></radialGradient></defs><rect width="1220" height="330" rx="18" fill="url(#bg)"/><rect width="1220" height="330" rx="18" fill="url(#dots)"/><rect width="1220" height="330" rx="18" fill="url(#glow)"/><rect x="0.5" y="0.5" width="1219" height="329" rx="18" fill="none" stroke="#D5DBE5"/><g transform="translate(30,140)"><rect width="150" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE5"/><rect width="5" height="38" x="10" y="10" rx="2.5" fill="#4B5565"/><text x="26" y="25" font-size="15" font-weight="600" fill="#0F172A">Queued</text><text x="26" y="45" font-size="12.5" fill="#4B5565">waits for its turn</text></g><g transform="translate(240,140)"><rect width="170" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE5"/><rect width="5" height="38" x="10" y="10" rx="2.5" fill="#0B6FA4"/><text x="26" y="25" font-size="15" font-weight="600" fill="#0F172A">Running</text><text x="26" y="45" font-size="12.5" fill="#4B5565">steps start in order</text></g><g transform="translate(480,40)"><rect width="170" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE5"/><rect width="5" height="38" x="10" y="10" rx="2.5" fill="#2E7D32"/><text x="26" y="25" font-size="15" font-weight="600" fill="#0F172A">Succeeded</text><text x="26" y="45" font-size="12.5" fill="#4B5565">every step done</text><g transform="translate(136.8,18.0)"><rect width="21.2" height="22" rx="11" fill="#2E7