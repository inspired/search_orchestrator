" font-weight="600" fill="#0F172A">Daily summary</text><text x="26" y="45" font-size="12.5" fill="#4B5565">index=web | stats …</text><g transform="translate(140.8,18.0)"><rect width="57.2" height="22" rx="11" fill="#2E7D32" fill-opacity="0.16"/><text x="28.6" y="15" font-size="11.5" font-weight="600" fill="#2E7D32" text-anchor="middle">✓ done</text></g></g><g transform="translate(780,265)"><rect width="210" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE5"/><rect width="5" height="38" x="10" y="10" rx="2.5" fill="#0B6FA4"/><text x="26" y="25" font-size="15" font-weight="600" fill="#0F172A">Count errors</text><text x="26" y="45" font-size="12.5" fill="#4B5565">index=_internal …</text><g transform="translate(140.8,18.0)"><rect width="57.2" height="22" rx="11" fill="#2E7D32" fill-opacity="0.16"/><text x="28.6" y="15" font-size="11.5" font-weight="600" fill="#2E7D32" text-anchor="middle">✓ done</text></g></g><g transform="translate(1040,40)"><rect width="222" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE5"/><rect width="5" height="38" x="10" y="10" rx="2.5" fill="#0B6FA4"/><text x="26" y="25" font-size="15" font-weight="600" fill="#0F172A">Weekly rollup</text><text x="26" y="45" font-size="12.5" fill="#4B5565">after Daily summary</text><g transform="translate(145.6,18.0)"><rect width="64.4" height="22" rx="11" fill="#0B6FA4" fill-opacity="0.16"/><text x="32.2" y="15" font-size="11.5" font-weight="600" fill="#0B6FA4" text-anchor="middle">running</text></g></g><g transform="translate(1040,175)"><rect width="222" height="58" rx="12" fill="#FFFFFF" stroke="#D5DBE5"/><rect width="5" height="38" x="10" y="10" rx="2.5" fill="#0F8C80"/><text x="26" y="25" font-size="15" font-weight="600" fill="#0F172A">Save to lookup</text><text x="26" y="45" font-size="12.5" fill="#4B5565">top_errors.csv</text><g transform="translate(145.6,18.0)"><rect width="64.4" height="22" rx="11" fill="#C46A00" fill-opacity="0.16"/><text x="32.2" y="15" font-size="11.5" font-weight="600" fill="#C46A